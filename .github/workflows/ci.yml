name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Lean proof escape check
        run: |
          if grep -R -nE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' --include='*.lean' OpenVMRVR; then
            echo "Forbidden Lean proof escape found."
            exit 1
          fi
      - name: Lean build
        run: lake build
      - name: Rust checks when Cargo.toml exists
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            cargo fmt --all -- --check
            cargo check --all-targets
            cargo test --all-targets
          fi
