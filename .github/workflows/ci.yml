name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lean build and kernel-environment audit
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: OpenVMRVR

      - name: Explicit proof-escape source check
        shell: bash
        run: |
          if grep -R -nE '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' \
              --include='*.lean' OpenVMRVR; then
            echo "Forbidden Lean proof escape found."
            exit 1
          fi

      - name: Rust checks when Cargo.toml exists
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            cargo fmt --all -- --check
            cargo check --all-targets
            cargo test --all-targets
          fi

      - name: Result-manifest checks when available
        shell: bash
        run: |
          if [[ -x scripts/check-results.sh ]]; then
            scripts/check-results.sh
          fi
